name: Portable renderer and XGL adapter
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j4 software CFLAGS='-O2 -fPIC -std=c89'
      - run: make test test-accel CFLAGS='-O2 -fPIC -std=c89'
      - run: python3 tests/check_api.py lib/liboldengl.so
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb xauth xfonts-base
      - run: make -j4 glx-software CFLAGS='-O2 -fPIC -std=c89' X11_CPPFLAGS= X11_LIBS=-lX11
      - run: xvfb-run -a make test-glx CFLAGS='-O2 -fPIC -std=c89' X11_CPPFLAGS= X11_LIBS=-lX11
